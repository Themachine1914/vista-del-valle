# Optional local Postgres when you are not using a hosted Supabase project.
# Point DATABASE_URL and DIRECT_URL at this instance (see .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vista
      POSTGRES_PASSWORD: vista
      POSTGRES_DB: vistadelvalle
    ports:
      - "5433:5432"
    volumes:
      - vista_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vista -d vistadelvalle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vista_pgdata:
